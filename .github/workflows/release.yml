name: Release

# Pushing a tag like v0.1.0 builds a universal (Apple Silicon + Intel) AngkorDB.app, wraps it in a
# DMG and publishes it as a GitHub Release. Nothing happens on branches or pull requests.
#
# Signing and notarization run when these repository secrets exist (ANG-57); without them the
# build is ad-hoc signed, which is fine for personal use (`xattr -cr /Applications/AngkorDB.app`):
#   APPLE_CERTIFICATE (base64 of the Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Updater files are made when TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) exist
# (ANG-59).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (an existing one, e.g. v0.1.0)"
        required: true

permissions:
  contents: write # to create the release and upload its files

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the changelog and the build number need the history

      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build, sign, notarize and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization (ANG-57): all empty means an ad-hoc signed build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signature (ANG-59).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: AngkorDB ${{ env.TAG }}
          releaseDraft: true # looked over, then published by hand
          prerelease: false
          args: --target universal-apple-darwin

      - name: Changelog from what was merged since the last release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          gh release edit "$TAG" --notes "$notes"

      - name: Say whether it is signed
        run: |
          if [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "::warning::No Developer ID secrets: this release is ad-hoc signed and not notarized (Gatekeeper will warn)."
          fi
