name: Release

# Pushing a tag like v0.1.0 builds a universal (Apple Silicon + Intel) AngkorDB.app, wraps it in a
# DMG and publishes it as a GitHub Release. Nothing happens on branches or pull requests.
#
# The release is ad-hoc signed and not notarized (ANG-57 is not done: no Apple Developer account).
# People download the DMG from the release page and let macOS open it once (the release notes say
# how). If Developer ID secrets are added later, the same workflow signs and notarizes:
#   APPLE_CERTIFICATE (base64 of the Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Updates do not depend on Apple: they are checked against our own key (ANG-59). Add
# TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one) as secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (an existing one, e.g. v0.1.0)"
        required: true

permissions:
  contents: write # to create the release and upload its files

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the changelog and the build number need the history

      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Only the secrets that exist are passed on: an empty APPLE_SIGNING_IDENTITY would be taken
      # as an identity called "" instead of falling back to the ad-hoc signature in tauri.conf.json.
      - name: Pass on the signing secrets that exist
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value=$(printf '%s' "$SECRETS" | jq -r --arg n "$name" '.[$n] // empty')
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "$name: not set"
            fi
          done

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: AngkorDB ${{ env.TAG }}
          releaseDraft: true # looked over, then published by hand
          prerelease: false
          args: --target universal-apple-darwin

      - name: "Release notes: what changed, and how to open the app"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            cat .github/release-install.txt >> notes.md
          fi
          gh release edit "$TAG" --notes-file notes.md

      - name: Say whether it is signed
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::notice::Ad-hoc signed, not notarized: the release notes explain how to open it."
          fi
