name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend: same scripts as `npm run check` locally. Fast and cheap.
  web:
    name: Web (typecheck, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  # Rust: fmt, clippy, unit tests, bindings drift test and Postgres integration tests.
  # Linux because service containers need it, and Linux minutes are 10x cheaper than macOS.
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: angkor
          POSTGRES_PASSWORD: angkor
          POSTGRES_DB: angkordb_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U angkor -d angkordb_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # No debug info and no incremental data in the test binaries: there are about 25 of them,
      # and with both the runner's disk fills up while linking ("ld terminated with signal 7
      # [Bus error]"). Nothing here is debugged on the runner.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # An unreachable database fails the tests instead of skipping them.
      ANGKORDB_REQUIRE_DB: "1"
      # The SSH tunnel tests: the SSH server runs on the host network (below), so the database
      # is `localhost:54329` from where it stands.
      ANGKORDB_TEST_SSH_DB_HOST: localhost
      ANGKORDB_TEST_SSH_DB_PORT: "54329"
      # The jump host tests: a second SSH server on the host network, reached through the first.
      ANGKORDB_TEST_SSH_INNER_HOST: localhost
      ANGKORDB_TEST_SSH_INNER_PORT: "2223"
    steps:
      - uses: actions/checkout@v7

      # The runner has about 14 GB free; a Tauri build with its test binaries needs more than
      # that unless the toolchains this project never uses are removed.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config postgresql-client \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `tauri::generate_context!()` needs the built frontend (`dist/`) to compile.
      - run: npm ci
      - run: npx vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Start the test SSH server
        run: |
          docker build -t angkordb-sshd dev/sshd
          docker run -d --name angkordb-sshd --network host \
            -v "$PWD/dev/sshd/authorized:/authorized:ro" \
            angkordb-sshd /usr/sbin/sshd -D -e -p 2222
          # The server behind it (the jump host tests).
          docker run -d --name angkordb-sshd-inner --network host \
            -v "$PWD/dev/sshd/authorized:/authorized:ro" \
            angkordb-sshd /usr/sbin/sshd -D -e -p 2223

      - name: Start the TLS-only Postgres
        run: |
          docker build -t angkordb-pgtls dev/tls
          docker run -d --name angkordb-pgtls -p 54330:5432 \
            -e POSTGRES_USER=angkor -e POSTGRES_PASSWORD=angkor -e POSTGRES_DB=angkordb_dev \
            -v "$PWD/dev/tls/certs:/certs" angkordb-pgtls
          # The certificates are made on its first start.
          for i in $(seq 1 60); do
            [ -f dev/tls/certs/client-rsa.key ] && docker exec angkordb-pgtls pg_isready -h 127.0.0.1 -U angkor && break
            sleep 1
          done

      - name: Load dev seed data
        run: >-
          psql "postgres://angkor:angkor@localhost:54329/angkordb_dev"
          -v ON_ERROR_STOP=1 -q -f dev/seed.sql

      - run: npm run rust:check

  # Full macOS app build. Manual only: macOS minutes cost 10x on private repos.
  # Run it from the Actions tab ("Run workflow"); tagged releases come with ANG-58.
  build-macos:
    name: macOS app build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --debug --bundles app
