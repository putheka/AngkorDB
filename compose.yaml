# Local Postgres for development and integration tests.
# URL: postgres://angkor:angkor@localhost:54329/angkordb_dev
name: angkordb

services:
  postgres:
    image: postgres:16-alpine
    container_name: angkordb-postgres
    # Come back after Docker Desktop or the Mac restarts.
    restart: unless-stopped
    environment:
      POSTGRES_USER: angkor
      POSTGRES_PASSWORD: angkor
      POSTGRES_DB: angkordb_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev:/seed:ro
      # Runs only on first start (empty volume). Re-seed with `npm run db:seed`.
      - ./dev/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      # TCP, not the socket: the init server (running the seed) only listens on the socket,
      # so this stays unhealthy until seeding has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U angkor -d angkordb_dev"]
      interval: 2s
      timeout: 3s
      retries: 60

  # An SSH server to test the SSH tunnel against (ANG-43): ssh -p 2222 tunnel@localhost,
  # password `tunnel`. From in there the database is `postgres:5432`.
  sshd:
    build: ./dev/sshd
    container_name: angkordb-sshd
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "2222:22"
    volumes:
      - ./dev/sshd/authorized:/authorized:ro

  # A second SSH server with no published port: only `sshd` (the bastion) can reach it, as
  # `sshd-inner:22`. Tests the jump host chain (ANG-49): you -> sshd -> sshd-inner -> postgres.
  sshd-inner:
    build: ./dev/sshd
    container_name: angkordb-sshd-inner
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./dev/sshd/authorized:/authorized:ro

  # A Postgres that only accepts TLS, to test the SSL modes and certificate files against
  # (ANG-44): localhost:54330, user angkor / angkor, or `certuser` with the client certificate.
  # The certificates are made on first start into dev/tls/certs/.
  postgres-tls:
    build: ./dev/tls
    container_name: angkordb-postgres-tls
    restart: unless-stopped
    environment:
      POSTGRES_USER: angkor
      POSTGRES_PASSWORD: angkor
      POSTGRES_DB: angkordb_dev
    ports:
      - "54330:5432"
    volumes:
      - ./dev/tls/certs:/certs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U angkor -d angkordb_dev"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
